# Builds MiniDeck on every push and pull request; a version tag (v0.25) also publishes a release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']          # path filters don't apply to tags, so releases always build
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    # Pinned to macOS 26 (not macos-latest) so the image can't silently change.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode 26 (Liquid Glass needs the macOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$XC" ]] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "Using $XC, macOS SDK $SDK"; swift --version
          [[ ${SDK%%.*} -ge 26 ]] || { echo "::error::macOS SDK $SDK is older than 26"; exit 1; }

      - name: Build (one retry for flaky failures)
        run: |
          for attempt in 1 2; do
            ./build.sh && exit 0
            echo "::warning::Build attempt $attempt failed"
            [[ $attempt == 2 ]] || { rm -rf .build-arm64 .build-x86; sleep 20; }
          done
          exit 1

      - name: Check the app
        run: |
          BIN=MiniDeck.app/Contents/MacOS/MiniDeck
          ARCHS=$(lipo -archs $BIN); echo "Architectures: $ARCHS"
          [[ $ARCHS == *arm64* && $ARCHS == *x86_64* ]] || { echo "::error::Not a universal binary"; exit 1; }
          nm -m $BIN | grep -q NSGlassEffectView || { echo "::error::Liquid Glass isn't compiled in"; exit 1; }
          V=$(plutil -extract CFBundleShortVersionString raw MiniDeck.app/Contents/Info.plist)
          echo "Version $V"
          if [[ $GITHUB_REF == refs/tags/v* && "v$V" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($V)"; exit 1
          fi
          codesign --verify --verbose $BIN

      - uses: actions/upload-artifact@v7
        with:
          name: MiniDeck
          path: dist/MiniDeck.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$GITHUB_REF_NAME; V=${TAG#v}
          git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          cp dist/MiniDeck.zip "dist/MiniDeck-$V.zip"
          cat > notes.md <<NOTES
          $NOTES

          ### Install
          1. Download **MiniDeck-$V.zip** below and unzip it.
          2. Drag **MiniDeck.app** into **Applications** and open it from there.
          3. The app isn't notarized by Apple, so the first time macOS says it can't verify the developer:
             right-click the app → **Open**, or go to **System Settings → Privacy & Security → Open Anyway**.
          4. Allow MiniDeck to control **Music** when asked.

          Requires macOS 14 or later (Liquid Glass needs macOS 26). Universal: Apple Silicon and Intel.
          Built by GitHub Actions ([log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)).
          NOTES
          sed -i '' 's/^          //' notes.md
          gh release create "$TAG" "dist/MiniDeck-$V.zip" --title "MiniDeck $V" --notes-file notes.md
